# Konfiguration für `schemathesis run openapi.yaml` (siehe tests/run-schemathesis.sh)
# TRACE-Requests führen bei www.swm.de zu einem TCP-Reset und würden die Coverage-Phase abbrechen,
# deshalb werden keine unerwarteten HTTP-Methoden ausprobiert.
base-url = "https://www.swm.de/.rest"
rate-limit = "4/s"
continue-on-failure = true

[generation]
max-examples = 50

[phases.coverage]
unexpected-methods = []

[reports.junit]
enabled = true
path = "tests/reports/junit.xml"
